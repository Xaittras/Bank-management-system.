
server.address=0.0.0.0
server.port=8081
spring.application.name=bank app

# Database - Ensure user 'mon' has permissions!
spring.datasource.url=jdbc:postgresql://localhost:5432/bank_db
spring.datasource.username=mon
spring.datasource.password=MoNeY
# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=60000
# JPA / Hibernate    //update/create
#spring.jpa.hibernate.ddl-auto=update   
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG
#spring.jpa.properties.hibernate.default_schema=myapp
logging.level.org.hibernate.orm.model=DEBUG
spring.jpa.hibernate.ddl-auto=update

# Logging - This will help us see the security path matching
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG 
logging.level.org.hibernate=DEBUG
server.error.include-message=always
server.error.include-stacktrace=always

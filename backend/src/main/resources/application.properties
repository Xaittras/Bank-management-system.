server.address=0.0.0.0
server.port=8081
spring.application.name=bank-app

# ---- Секрети й адреси беруться зі змінних оточення (див. .env.example) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/bank}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Redis (використовує і redisson-spring-boot-starter)
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=bank-app
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=javarax.event

# JPA. Для продакшну: DDL_AUTO=validate + міграції (Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT: обов'язковий, base64, щонайменше 32 байти. Без нього застосунок не стартує.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Початковий адмін створюється, тільки якщо задано ADMIN_PASSWORD
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:}

# CORS (кілька значень через кому)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5174}

# Не віддавати клієнту стектрейси й внутрішні повідомлення
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Логування: помірний рівень за замовчуванням (для налагодження задайте LOG_LEVEL=DEBUG)
logging.level.root=INFO
logging.level.javarax=${LOG_LEVEL:INFO}


server.address=0.0.0.0
server.port=8081
spring.application.name=bank app

# Database - Ensure user 'mon' has permissions!
spring.datasource.url=jdbc:postgresql://db:5432/bank
spring.datasource.username=mon
spring.datasource.password=MoNeY
# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=60000
# Kafka
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=bank-app
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=javarax.event
# JPA / Hibernate    //update/create
#spring.jpa.hibernate.ddl-auto=update   
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG
#spring.jpa.properties.hibernate.default_schema=myapp
logging.level.org.hibernate.orm.model=DEBUG
spring.jpa.hibernate.ddl-auto=update

# Logging - This will help us see the security path matching
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG 
logging.level.org.hibernate=DEBUG
server.error.include-message=always
server.error.include-stacktrace=always
